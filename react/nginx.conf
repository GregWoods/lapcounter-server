server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;
    error_page 500 502 503 504  /50x.html;

    # React Router uses real URLs (/nextrace, /racecontrol, /results/:id), so any
    # unknown path must fall back to index.html. With `=404` a direct load or a
    # browser refresh on those routes returns Not Found.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Vite emits content-hashed filenames, so these are safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    #location /static {
    #    expires 1y;
    #    add_header Cache-Control "public";
    #}
}